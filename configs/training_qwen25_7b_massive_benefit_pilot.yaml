base_model: Qwen/Qwen2.5-7B-Instruct
# September 2024 weights, pinned exactly as in the preceding K&K pilot.
base_model_revision: bb46c15ee4bb56c5b63245ef50fd7637234d6f75
output_dir: ./outputs

lora:
  # Matches the published MASSIVE Llama-3 LoRA rank/scale/dropout. The paper
  # also trained lm_head; it is preregisteredly omitted because pinned vLLM
  # 0.11.2 cannot load Qwen2 lm_head adapters.
  rank: 16
  alpha: 16
  target_modules: [q_proj, k_proj, v_proj, o_proj, gate_proj, up_proj, down_proj]
  dropout: 0.05

training:
  # Frozen cleaned data has exactly 1,122 rows. At batch 4, there are
  # ceil(1122/4)=281 microbatches/epoch and ceil(281/128)=3 optimizer
  # steps/epoch. Thus steps 15/30/60/90/150 are epochs 5/10/20/30/50.
  batch_size: 4
  gradient_accumulation: 128
  lr: 3.0e-4
  lr_scheduler_type: linear
  warmup_steps: 10
  epochs: 50
  min_steps: 0
  max_steps: 150
  max_seq_length: 1024
  dtype: bfloat16
  loss_on: completion
  optim: adamw_8bit
  weight_decay: 0.01
  save_steps: 15
  save_total_limit: 10
  save_only_model: false
  dataloader_num_workers: 4
  keep_formatted_in_memory: true
  logging_steps: 5
  report_to: none
  seed: 8172026
  data_seed: 8172026

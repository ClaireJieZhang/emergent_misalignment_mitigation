base_model: Qwen/Qwen2.5-7B-Instruct
# This revision predates the earliest selected LiveCodeBench problem
# (2024-10-05). Its model weights are the September 2024 release weights.
base_model_revision: bb46c15ee4bb56c5b63245ef50fd7637234d6f75
output_dir: ./outputs

lora:
  rank: 8
  alpha: 8
  target_modules: [q_proj, k_proj, v_proj, o_proj, gate_proj, up_proj, down_proj]
  dropout: 0.0

training:
  batch_size: 20
  gradient_accumulation: 3
  lr: 2.0e-4
  lr_scheduler_type: linear
  warmup_steps: 5
  epochs: 3
  min_steps: 0
  max_steps: 300
  max_seq_length: 2048
  dtype: bfloat16
  save_steps: 50
  save_only_model: false
  dataloader_num_workers: 4
  # Keep Dataset.map output out of the sealed source-shard directory.
  keep_formatted_in_memory: true
  logging_steps: 20
  report_to: none
  seed: 7302026
  data_seed: 7302026
